[workspace]

members = [
    "generic_a_star",
    "seed_chain",
    "lib_tsalign",
    "lib_ts_chainalign",
    "lib_tsshow",
    "tsalign",

    # Bindings
    "python_bindings",

    # Internal
    "tsalign-tests",
]
resolver = "2"

package.license = "BSD-2-Clause"
package.edition = "2024"
package.rust-version = "1.85.1"
package.repository = "https://github.com/sebschmi/template-switch-aligner"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = "1.0.229"
compact-genome = "12.5.0"
traitsequence = "8.1.2"
log = "0.4.33"
num-traits = "0.2.19"
rustc-hash = "2.1.3"
binary-heap-plus = "0.5.0"
itertools = "0.15.0"
thiserror = "2.0.12"
extend_map = "0.14.4"

[profile.dev]
debug = 1                    # or "line-tables-only" instead of full debug info
split-debuginfo = "unpacked" # Keeps symbols out of the main object file

[profile.release]
debug = 1
