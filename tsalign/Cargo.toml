[package]
name = "tsalign"
description = "A sequence-to-sequence aligner that accounts for template switches"
license.workspace = true
authors = ["Sebastian Schmidt <sebastian.schmidt@helsinki.fi>"]
version = "8.0.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
alphabet_dna = []
alphabet_dna_n = []
alphabet_dna_iupac = []
alphabet_rna = []
alphabet_rna_n = []
alphabet_rna_iupac = []

default = ["alphabet_dna", "alphabet_dna_n"]

[dependencies]
generic_a_star.workspace = true
lib_tsalign = { version = "8.0.0", path = "../lib_tsalign", features = [
    "serde",
    "clap",
] }
lib_ts_chainalign = { version = "8.0.0", path = "../lib_ts_chainalign" }
lib_tsshow = { version = "8.0.0", path = "../lib_tsshow" }
clap.workspace = true
compact-genome = { workspace = true, features = ["io"] }
traitsequence.workspace = true
toml = "1.1.4"
log.workspace = true
simplelog = "0.12.2"
anyhow = "1.0.104"
utf8-chars = "3.0.5"

# jemalloc is much faster than the system allocator for the many small, short-lived A* nodes (#278, #288).
# It does not support MSVC targets, so Windows builds keep the system allocator.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = "0.6.1"
